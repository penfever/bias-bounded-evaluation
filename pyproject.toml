[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "differential-debiasing"
version = "0.1.0"
authors = [
    {name = "Benjamin Feuer", email = "bf996@nyu.edu"},
    {name = "Lucas Rosenblatt", email = "lucas.rosenblatt@nyu.edu"},
]
description = "Differential privacy-inspired techniques for reducing implicit bias in LLM judge evaluations"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security :: Cryptography",
]
keywords = ["bias", "differential-privacy", "llm", "evaluation", "debiasing"]
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "scikit-learn>=1.0.0",
    "pyyaml>=5.4.0",
    "tqdm>=4.60.0",
]

[project.optional-dependencies]
judge-integration = [
    "openai>=1.0.0",
    "anthropic>=0.3.0",
    "requests>=2.25.0",
]
oumi-integration = [
    "oumi @ git+https://github.com/oumi-ai/oumi.git",
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "accelerate>=0.20.0",
    "huggingface-hub>=0.15.0",
]
visualization = [
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    "plotly>=5.0.0",
]
dev = [
    "pytest>=6.0.0",
    "pytest-cov>=2.12.0",
    "black>=21.0.0",
    "isort>=5.9.0",
    "mypy>=0.900",
    "flake8>=3.9.0",
    "pre-commit>=2.15.0",
]
all = [
    "differential-debiasing[judge-integration,visualization,dev]",
]

[project.scripts]
differential-debias = "differential_debiasing.cli.main:main"

[project.urls]
"Homepage" = "https://github.com/penfever/differential-debiasing"
"Bug Reports" = "https://github.com/penfever/differential-debiasing/issues"
"Source" = "https://github.com/penfever/differential-debiasing"
"Documentation" = "https://differential-debiasing.readthedocs.io"

[tool.setuptools.packages.find]
where = ["."] 
include = ["differential_debiasing*"]
exclude = ["tests*", "scripts*", "archive*"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.black]
line-length = 100
target-version = ['py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  archive
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
combine_as_imports = true
split_on_trailing_comma = true

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Gradually enable
disallow_incomplete_defs = false  # Gradually enable
check_untyped_defs = true
disallow_untyped_decorators = false  # Gradually enable
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.coverage.run]
source = ["differential_debiasing"]
omit = [
    "*/tests/*",
    "*/archive/*",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
